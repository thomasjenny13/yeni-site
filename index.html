<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yéni</title>
<meta name="description" content="Espace privé.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=91">
</head>
<body class="is-locked">

<!-- MOT DE PASSE — écran noir, rien d'autre -->
<main class="gate" id="lockScreen">
  <form class="lock-form" id="unlockForm">
    <!-- champ « compte » constant : sans lui, iCloud Trousseau / gestionnaires
         de mots de passe ne proposent pas d'enregistrer un formulaire à mot
         de passe seul. Présent dans le rendu (pas display:none) mais invisible. -->
    <input type="text" name="username" id="user" value="famille yéni"
           autocomplete="username" readonly tabindex="-1" aria-hidden="true"
           style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px">
    <input type="password" id="pw" name="password" autocomplete="current-password"
           aria-label="Mot de passe" placeholder="Mot de passe" required autofocus>
    <p class="gate-error" id="err" role="alert"></p>
  </form>
</main>

<!-- PORTAIL — visible seulement après connexion -->
<div id="portal" hidden>
  <main class="portal-home">
    <div class="portal-ring">
      <div class="portal-crest">
        <img class="crest-arms" src="assets/img/armoiries.png" alt="Armoiries de la famille Jenny"
             width="1160" height="1360"
             onerror="this.hidden=true;this.nextElementSibling.hidden=false">
        <span class="crest-initial" data-glyph="J" aria-hidden="true" hidden>J</span>
        <span class="logo">yéni<span class="dot">.</span></span>
      </div>
      <svg class="portal-orbit" viewBox="0 0 360 360">
        <defs>
          <path id="orbTop" d="M 40.9 142.7 A 142 142 0 0 1 319.1 142.7"/>
          <path id="orbBot" d="M 40.9 217.3 A 142 142 0 0 0 319.1 217.3"/>
        </defs>
        <circle class="orb-ring" cx="180" cy="180" r="118"/>
        <circle class="orb-ring" cx="180" cy="180" r="168"/>
        <a class="orb-link" href="arbre.html">
          <text><textPath href="#orbTop" startOffset="50%" text-anchor="middle">Arbre généalogique</textPath></text>
        </a>
        <a class="orb-link" href="revisions.html">
          <text><textPath href="#orbBot" startOffset="24%" text-anchor="middle">Révisions</textPath></text>
        </a>
        <a class="orb-link" href="memoires.html">
          <text><textPath href="#orbBot" startOffset="74%" text-anchor="middle">Les Écrits du Claude</textPath></text>
        </a>
      </svg>
      <nav class="portal-index" hidden>
        <a href="arbre.html">Arbre généalogique</a>
        <a href="memoires.html">Les Écrits du Claude</a>
        <a href="revisions.html">Révisions</a>
      </nav>
    </div>
  </main>
</div>

<script src="assets/js/crypto.js?v=91"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const next = params.get("next");
  const body = document.body;
  const lockScreen = document.getElementById("lockScreen");
  const portal = document.getElementById("portal");
  const form = document.getElementById("unlockForm");
  const pw = document.getElementById("pw");
  const err = document.getElementById("err");

  // n'accepte qu'un nom de page local (jamais une URL absolue)
  const safeNext = (v) => (v && /^[\w-]+\.html([?#].*)?$/.test(v) ? v : null);

  function showPortal() {
    body.className = "is-portal";
    lockScreen.hidden = true;
    portal.hidden = false;
  }

  // Web Crypto n'existe qu'en contexte sécurisé (https ou localhost).
  if (!window.isSecureContext || !(window.crypto && crypto.subtle)) {
    const httpsUrl = "https://" + location.host + location.pathname + location.search;
    err.innerHTML = 'Ouvrir en <a href="' + httpsUrl + '" style="color:inherit;text-decoration:underline">https</a>.';
    pw.disabled = true;
    return;
  }

  // déjà déverrouillé : on saute l'écran, direct au portail (ou au lien profond)
  if (YeniCrypto.isUnlocked()) {
    const n = safeNext(next);
    if (n) { location.replace(n); return; }
    showPortal();
    return;
  }

  pw.focus();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    pw.disabled = true;
    try {
      const ok = await YeniCrypto.unlock(pw.value);
      if (!ok) { err.textContent = "Mot de passe incorrect."; pw.disabled = false; pw.select(); return; }
      // bon mot de passe mais la clé n'a pas pu être gardée : navigation privée
      // ou stockage bloqué — sans ça on tournerait en boucle sur l'écran mdp
      if (!YeniCrypto.isUnlocked()) {
        err.textContent = "Le navigateur bloque le stockage (navigation privée ?).";
        pw.disabled = false;
        return;
      }
      // on navigue toujours après un login réussi : c'est ce qui déclenche la
      // proposition « Enregistrer le mot de passe ? » de Safari / iCloud Trousseau
      // (sans navigation post-soumission, l'invite n'apparaît pas).
      location.replace(safeNext(next) || location.pathname);
    } catch (ex) {
      err.textContent = "Erreur : " + ex.message;
      pw.disabled = false;
    }
  });
})();
</script>

</body>
</html>
