<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yéni</title>
<meta name="description" content="Espace privé.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body class="is-locked">

<!-- ÉCRAN DE CONNEXION — rien d'autre n'est visible tant qu'on n'est pas entré -->
<main class="gate" id="lockScreen">
  <form class="gate-card" id="unlockForm">
    <div class="gate-mark">
      <img src="assets/img/favicon.svg" alt="" width="44" height="44">
      <span class="logo">yéni<span class="dot">.</span></span>
    </div>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus required>
    </div>
    <button class="btn" type="submit" id="unlockBtn">Entrer</button>
    <p class="gate-error" id="err" role="alert"></p>
  </form>
</main>

<!-- PORTAIL — visible seulement après connexion -->
<div id="portal" hidden>
  <main class="portal-home">
    <div class="portal-mark">
      <img src="assets/img/favicon.svg" alt="" width="40" height="40">
      <span class="logo">yéni<span class="dot">.</span></span>
    </div>
    <a class="tree-cta" href="arbre.html">Arbre généalogique</a>
    <p class="portal-note">Famille Jenny · Bâle</p>
  </main>
</div>

<script src="assets/js/crypto.js?v=7"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const next = params.get("next");
  const body = document.body;
  const lockScreen = document.getElementById("lockScreen");
  const portal = document.getElementById("portal");
  const form = document.getElementById("unlockForm");
  const pw = document.getElementById("pw");
  const btn = document.getElementById("unlockBtn");
  const err = document.getElementById("err");

  // n'accepte qu'un nom de page local (jamais une URL absolue)
  const safeNext = (v) => (v && /^[\w-]+\.html([?#].*)?$/.test(v) ? v : null);

  // Web Crypto n'existe qu'en contexte sécurisé (https ou localhost).
  // En http sur un vrai domaine, crypto.subtle est indéfini.
  if (!window.isSecureContext || !(window.crypto && crypto.subtle)) {
    const httpsUrl = "https://" + location.host + location.pathname + location.search;
    form.innerHTML =
      '<div class="gate-mark"><img src="assets/img/favicon.svg" alt="" width="44" height="44">' +
      '<span class="logo">yéni<span class="dot">.</span></span></div>' +
      '<p>Ce site doit être ouvert en <strong>https</strong>.</p>' +
      '<p style="margin-top:1rem"><a class="btn" href="' + httpsUrl + '">Ouvrir en https</a></p>' +
      '<p class="muted small" style="margin-top:1rem">Si le navigateur affiche un avertissement de certificat, ' +
      'c\'est que le certificat HTTPS n\'est pas encore actif — réessaie un peu plus tard.</p>';
    return;
  }

  function showPortal() {
    body.classList.remove("is-locked");
    body.classList.add("is-portal");
    lockScreen.hidden = true;
    portal.hidden = false;
  }

  if (YeniCrypto.isUnlocked()) {
    const n = safeNext(next);
    if (n) { location.replace(n); return; }
    showPortal();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const ok = await YeniCrypto.unlock(pw.value);
      if (!ok) { err.textContent = "Mot de passe incorrect."; pw.select(); return; }
      const n = safeNext(next);
      if (n) { location.replace(n); return; }
      showPortal();
    } catch (ex) {
      err.textContent = "Erreur : " + ex.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Entrer";
    }
  });

})();
</script>

</body>
</html>
