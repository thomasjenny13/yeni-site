<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yéni</title>
<meta name="description" content="Espace privé.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css?v=93">
</head>
<body class="is-locked">

<!-- MOT DE PASSE — écran noir, rien d'autre. Une fois entré : direct sur l'arbre. -->
<main class="gate" id="lockScreen">
  <form class="lock-form" id="unlockForm">
    <!-- champ « compte » constant : sans lui, iCloud Trousseau / gestionnaires
         de mots de passe ne proposent pas d'enregistrer un formulaire à mot
         de passe seul. Présent dans le rendu (pas display:none) mais invisible. -->
    <input type="text" name="username" id="user" value="famille yéni"
           autocomplete="username" readonly tabindex="-1" aria-hidden="true"
           style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px">
    <input type="password" id="pw" name="password" autocomplete="current-password"
           aria-label="Mot de passe" placeholder="Mot de passe" required autofocus>
    <!-- bouton submit obligatoire pour que la touche Entrée valide le formulaire
         (deux champs texte + aucun submit = pas de soumission implicite) ;
         rendu hors écran pour garder l'écran vide -->
    <button type="submit" tabindex="-1" aria-hidden="true"
            style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px">Entrer</button>
    <p class="gate-error" id="err" role="alert"></p>
  </form>
</main>

<script src="assets/js/crypto.js?v=93"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const next = params.get("next");
  const HOME = "arbre.html";   // après déverrouillage : direct sur l'arbre
  const pw = document.getElementById("pw");
  const err = document.getElementById("err");
  const form = document.getElementById("unlockForm");

  // n'accepte qu'un nom de page local (jamais une URL absolue)
  const safeNext = (v) => (v && /^[\w-]+\.html([?#].*)?$/.test(v) ? v : null);
  const dest = () => safeNext(next) || HOME;

  // Web Crypto n'existe qu'en contexte sécurisé (https ou localhost).
  if (!window.isSecureContext || !(window.crypto && crypto.subtle)) {
    const httpsUrl = "https://" + location.host + location.pathname + location.search;
    err.innerHTML = 'Ouvrir en <a href="' + httpsUrl + '" style="color:inherit;text-decoration:underline">https</a>.';
    pw.disabled = true;
    return;
  }

  // déjà déverrouillé : on ne montre jamais l'écran, direct à destination
  if (YeniCrypto.isUnlocked()) { location.replace(dest()); return; }

  pw.focus();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    pw.disabled = true;
    try {
      const ok = await YeniCrypto.unlock(pw.value);
      if (!ok) { err.textContent = "Mot de passe incorrect."; pw.disabled = false; pw.select(); return; }
      // bon mot de passe mais la clé n'a pas pu être gardée : navigation privée
      // ou stockage bloqué — sans ça on tournerait en boucle sur l'écran mdp
      if (!YeniCrypto.isUnlocked()) {
        err.textContent = "Le navigateur bloque le stockage (navigation privée ?).";
        pw.disabled = false;
        return;
      }
      // on navigue toujours après un login réussi : c'est ce qui déclenche la
      // proposition « Enregistrer le mot de passe ? » de Safari / iCloud Trousseau.
      location.replace(dest());
    } catch (ex) {
      err.textContent = "Erreur : " + ex.message;
      pw.disabled = false;
    }
  });
})();
</script>

</body>
</html>
