<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yéni</title>
<meta name="description" content="Espace privé.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=53">
</head>
<body class="is-landing">

<!-- PAGE D'ACCUEIL -->
<main class="gate" id="landing">
  <div class="gate-card landing-card">
    <div class="gate-mark">
      <img src="assets/img/favicon.svg" alt="" width="46" height="46">
      <span class="logo">yéni<span class="dot">.</span></span>
    </div>
    <p>Le coin de la famille Jenny.</p>
    <button class="btn" type="button" id="enterBtn" style="margin-top:1.5rem">Entrer</button>
  </div>
</main>

<!-- MOT DE PASSE -->
<main class="gate" id="lockScreen" hidden>
  <form class="gate-card" id="unlockForm">
    <div class="gate-mark">
      <img src="assets/img/favicon.svg" alt="" width="44" height="44">
      <span class="logo">yéni<span class="dot">.</span></span>
    </div>
    <!-- champ « compte » constant : sans lui, iCloud Trousseau / gestionnaires
         de mots de passe ne proposent pas d'enregistrer un formulaire à mot
         de passe seul. Présent dans le rendu (pas display:none) mais invisible. -->
    <input type="text" name="username" id="user" value="famille yéni"
           autocomplete="username" readonly tabindex="-1" aria-hidden="true"
           style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px">
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit" id="unlockBtn">Entrer</button>
    <p class="gate-error" id="err" role="alert"></p>
  </form>
</main>

<!-- PORTAIL — visible seulement après connexion -->
<div id="portal" hidden>
  <main class="portal-home">
    <header class="portal-crest">
      <span class="logo">yéni<span class="dot">.</span></span>
      <img src="assets/img/blason.svg" alt="Blason de la famille Jenny" width="132" height="154">
    </header>
    <nav class="portal-index">
      <a href="arbre.html"><span class="pi-num">I</span><span class="pi-name">Arbre généalogique</span></a>
      <a href="memoires.html"><span class="pi-num">II</span><span class="pi-name">Les Écrits du Claude</span></a>
      <a href="revisions.html"><span class="pi-num">III</span><span class="pi-name">Révisions</span></a>
    </nav>
  </main>
</div>

<script src="assets/js/crypto.js?v=53"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const next = params.get("next");
  const body = document.body;
  const landing = document.getElementById("landing");
  const lockScreen = document.getElementById("lockScreen");
  const portal = document.getElementById("portal");
  const form = document.getElementById("unlockForm");
  const pw = document.getElementById("pw");
  const btn = document.getElementById("unlockBtn");
  const err = document.getElementById("err");

  // n'accepte qu'un nom de page local (jamais une URL absolue)
  const safeNext = (v) => (v && /^[\w-]+\.html([?#].*)?$/.test(v) ? v : null);

  function setState(cls) {
    body.className = cls;   // is-landing | is-locked | is-portal
  }
  function showLocked() {
    setState("is-locked");
    landing.hidden = true;
    lockScreen.hidden = false;
    pw.focus();
  }
  function showPortal() {
    setState("is-portal");
    landing.hidden = true;
    lockScreen.hidden = true;
    portal.hidden = false;
  }

  // Web Crypto n'existe qu'en contexte sécurisé (https ou localhost).
  if (!window.isSecureContext || !(window.crypto && crypto.subtle)) {
    const httpsUrl = "https://" + location.host + location.pathname + location.search;
    landing.querySelector(".landing-card").innerHTML =
      '<div class="gate-mark"><img src="assets/img/favicon.svg" alt="" width="44" height="44">' +
      '<span class="logo">yéni<span class="dot">.</span></span></div>' +
      '<p>Ce site doit être ouvert en <strong>https</strong>.</p>' +
      '<p style="margin-top:1rem"><a class="btn" href="' + httpsUrl + '">Ouvrir en https</a></p>';
    return;
  }

  document.getElementById("enterBtn").addEventListener("click", showLocked);

  if (YeniCrypto.isUnlocked()) {
    const n = safeNext(next);
    if (n) { location.replace(n); return; }
    showPortal();
  } else if (safeNext(next)) {
    // on venait d'un lien profond : on saute l'accueil, direct au mot de passe
    showLocked();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const ok = await YeniCrypto.unlock(pw.value);
      if (!ok) { err.textContent = "Mot de passe incorrect."; pw.select(); return; }
      // on navigue toujours après un login réussi : c'est ce qui déclenche la
      // proposition « Enregistrer le mot de passe ? » de Safari / iCloud Trousseau
      // (sans navigation post-soumission, l'invite n'apparaît pas).
      location.replace(safeNext(next) || location.pathname);
    } catch (ex) {
      err.textContent = "Erreur : " + ex.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Entrer";
    }
  });
})();
</script>

</body>
</html>
