<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=111">
</head>
<body class="is-locked galerie-page" data-galerie="ruhr" data-base="../">

<!-- galerie partagée hors famille : mot de passe propre, pas de lien vers le reste du site -->
<main class="gate" id="lockScreen">
  <form class="lock-form" id="unlockForm">
    <input type="text" name="username" value="photos ruhr"
           autocomplete="username" readonly tabindex="-1" aria-hidden="true"
           style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px">
    <input type="password" id="pw" name="password" autocomplete="current-password"
           aria-label="Mot de passe" placeholder="Mot de passe" required autofocus>
    <button type="submit" tabindex="-1" aria-hidden="true"
            style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px">Entrer</button>
    <p class="gate-error" id="err" role="alert"></p>
  </form>
</main>

<div class="galerie" id="galerie" hidden>
  <header class="gal-head" hidden>
    <h1 id="galTitle"></h1>
    <p class="gal-sub" id="galSub"></p>
  </header>
  <div class="gal-grid" id="galGrid"></div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-bar">
    <span class="lb-count" id="lbCount"></span>
    <button class="lb-btn" id="lbClose" type="button" aria-label="Fermer">✕</button>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Précédente">‹</button>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Suivante">›</button>
</div>

<script src="../assets/js/galerie.js?v=111"></script>

</body>
</html>
