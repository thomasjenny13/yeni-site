<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Une main glissant un bulletin dans l'urne">
  <g fill="none" stroke="#1f2530" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- sol -->
    <path d="M20 288 H300"/>
    <path d="M40 300 l12 -8 M90 302 l12 -8 M210 302 l12 -8 M260 300 l12 -8" stroke-width="1.3"/>

    <!-- urne : face avant + côté + dessus (perspective) -->
    <path d="M84 288 V150 H206 V288"/>
    <path d="M206 150 l40 -26 V262 l-40 26"/>
    <path d="M84 150 l40 -26 H246"/>
    <!-- fente -->
    <path d="M120 132 h70 M120 132 l40 -22 h70" stroke-width="2"/>
    <path d="M190 132 l40 -22" stroke-width="2"/>

    <!-- croix suisse sur la face -->
    <path d="M132 196 h30 v-22 h16 v22 h30 v16 h-30 v22 h-16 v-22 h-30 z"/>

    <!-- hachures d'ombre sur le côté -->
    <path d="M212 170 l28 -18 M212 190 l30 -20 M212 210 l30 -20 M212 230 l30 -20 M212 250 l28 -18" stroke-width="1"/>

    <!-- bulletin plié entrant dans la fente -->
    <path d="M146 122 l46 -34 30 20 -46 34 z"/>
    <path d="M158 108 l32 -22 M166 118 l32 -22" stroke-width="1.3"/>

    <!-- main tenant le bulletin, venant d'en haut -->
    <path d="M196 92 q6 -18 24 -22 l20 -2 q14 0 14 12 q0 8 -10 10 l-14 2 q-2 10 -12 14 z"/>
    <path d="M234 68 q0 -12 -8 -18 M246 70 q4 -12 -2 -22 M256 78 q10 -8 8 -20" stroke-width="1.8"/>
    <path d="M214 102 q10 6 22 4" stroke-width="1.3"/>
    <path d="M270 58 q10 -6 8 -18 M280 66 q12 -4 12 -16" stroke-width="1.5"/>
  </g>
</svg>
