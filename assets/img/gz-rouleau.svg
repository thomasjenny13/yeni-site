<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-label="Un rouleau compresseur écrasant des journaux">
  <g fill="none" stroke="#1f2530" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
