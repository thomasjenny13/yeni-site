    <circle cx="132" cy="244" r="60"/>
    <circle cx="132" cy="244" r="15"/>
    <path d="M132 184 V204 M132 284 V304 M72 244 H92 M172 244 H192 M90 202 l14 14 M174 202 l-14 14 M90 286 l14 -14 M174 286 l-14 -14" stroke-width="1.5"/>
