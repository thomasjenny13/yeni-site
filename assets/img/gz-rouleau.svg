    <!-- corps / chaudière -->
    <path d="M214 168 h150 a16 16 0 0 1 16 16 v78 a12 12 0 0 1 -12 12 h-158 a12 12 0 0 1 -12 -12 v-78 a16 16 0 0 1 16 -16 z"/>
    <path d="M214 196 h172 M214 230 h172" stroke-width="1.4"/>
    <circle cx="228" cy="182" r="2.2" fill="#1f2530"/><circle cx="256" cy="182" r="2.2" fill="#1f2530"/><circle cx="284" cy="182" r="2.2" fill="#1f2530"/><circle cx="312" cy="182" r="2.2" fill="#1f2530"/>
    <path d="M300 214 h64 M300 224 h52 M300 244 h64 M300 254 h44" stroke-width="1.3"/>

    <!-- cheminée + fumée -->
    <path d="M236 168 v-52 h20 v52 M232 116 h28"/>
    <path d="M246 104 q-10 -12 2 -22 q12 -8 2 -20" stroke-width="1.6"/>
    <path d="M262 96 q10 -10 0 -22" stroke-width="1.4"/>

    <!-- toit / auvent -->
    <path d="M198 96 h180 l-6 12 h-168 z"/>
    <path d="M214 108 v58 M298 108 v50 M362 108 v58"/>

    <!-- conducteur -->
    <circle cx="330" cy="150" r="10"/>
    <path d="M330 160 l-6 34 h16 l-4 -34 M322 172 l-14 10 M338 172 l12 8"/>

    <!-- roue arrière -->
    <circle cx="336" cy="266" r="40"/>
    <circle cx="336" cy="266" r="10"/>
    <path d="M336 226 V246 M336 286 V306 M296 266 H316 M356 266 H376 M312 242 l12 12 M360 242 l-12 12" stroke-width="1.5"/>
  </g>
