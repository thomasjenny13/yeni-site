    <path d="M6 306 H414"/>
    <path d="M20 318 l14 -8 M60 320 l14 -8 M100 318 l14 -8 M300 320 l14 -8 M340 318 l14 -8 M380 320 l14 -8" stroke-width="1.4"/>

