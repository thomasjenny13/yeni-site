    <path d="M30 286 l64 -16 44 10" stroke-width="1.4"/>
    <path d="M40 292 h40 M44 298 h48 M52 283 h30" stroke-width="1.4"/>
    <path d="M96 302 l40 -6 20 6 -6 10 -46 2 z"/>
    <path d="M104 300 h34 M110 306 h30" stroke-width="1.3"/>

